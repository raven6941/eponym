name: compile-time budget

on:
  pull_request:
    paths:
      - "src/eponym/**"
      - "lib/**"
      - "examples/embedded/**"
      - "bench/**"
      - "tools/compile_time_bench.py"
      - ".github/workflows/compile-time-budget.yml"
  schedule:
    - cron: "0 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Nim
        run: |
          curl -sSf https://nim-lang.org/choosenim/init.sh | sh -s -- -y
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
      - name: Select Nim version
        run: choosenim 2.4.0
      - name: Select baseline commit
        id: baseline
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$(git rev-parse HEAD^)"
          fi
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "Compile-time baseline: $base_sha"
      - name: Check out baseline
        run: git worktree add --detach "$RUNNER_TEMP/eponym-baseline" "${{ steps.baseline.outputs.sha }}"
      - name: Measure baseline corpus
        run: |
          python3 "$GITHUB_WORKSPACE/tools/compile_time_bench.py" \
            --repo-root "$RUNNER_TEMP/eponym-baseline" \
            --output "$RUNNER_TEMP/compile-time-baseline.json"
      - name: Verify regression detector
        run: python3 tools/compile_time_bench.py --self-test
      - name: Measure candidate and compare
        run: |
          python3 tools/compile_time_bench.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --compare "$RUNNER_TEMP/compile-time-baseline.json" \
            --output "$RUNNER_TEMP/compile-time-candidate.json"
      - name: Save measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-time-budget-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/compile-time-baseline.json
            ${{ runner.temp }}/compile-time-candidate.json
          if-no-files-found: warn
