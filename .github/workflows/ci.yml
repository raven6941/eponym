name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nim
        run: |
          curl -sSf https://nim-lang.org/choosenim/init.sh | sh -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
      - name: Select Nim version
        run: choosenim 2.2.12
      - name: Build
        run: |
          nim --version
          P="--path:src --path:src/eponym --path:src/relational --path:src/staging"
          for f in eponym eponym_init preterm parse_surf mac_surf elab eponym_mac lsp egraph eponym_embed kernel_check sheds sheds_mac shed_layout; do
            echo "=== build $f ==="
            nim c --hints:off $P "src/eponym/$f.nim" || exit 1
          done
          echo "=== build repl (issue #50) ==="
          nim c --hints:off $P "src/repl.nim" || exit 1
      - name: Test
        run: |
          P="--path:src --path:src/eponym --path:src/relational --path:src/staging"
          for f in eponym eponym_init preterm parse_surf mac_surf elab eponym_mac egraph eponym_embed kernel_check; do
            echo "=== test $f ==="
            nim c -r --hints:off $P "src/eponym/$f.nim" || exit 1
          done
          echo "=== examples ==="
          nim c -r --hints:off $P "tests/run_examples.nim" || exit 1
          echo "=== repl scripted session (issue #50) ==="
          sh tests/repl_session.sh || exit 1
          echo "=== kernel audit (issue #62: independent re-check) ==="
          nim c -r --hints:off $P "tests/kernel_audit.nim" || exit 1
          echo "=== embedded examples (issue #149) ==="
          nim c -r --hints:off $P "tests/run_embedded_examples.nim" || exit 1
          echo "=== surface-syntax conformance (issue #144) ==="
          nim c -r --hints:off $P "tests/surface_conformance.nim" || exit 1
          echo "=== elaboration adequacy properties (issue #38) ==="
          nim c -r --hints:off $P "tests/adequacy_props.nim" || exit 1
          echo "=== embedded macro forms (issue #151) ==="
          nim c -r --hints:off $P "tests/test_embedded_macro_forms.nim" || exit 1
          echo "=== staging soundness fuzz (issue #29, fixed seed) ==="
          nim c -r --hints:off $P "tests/fuzz_soundness.nim" -- --seed 424242 -n 1000 || exit 1
          echo "=== egraph property tests (issue #163, fixed seed) ==="
          nim c -r --hints:off $P "tests/pbt_egraph.nim" || exit 1
          echo "=== minikanren property tests (issue #163, fixed seed) ==="
          nim c -r --hints:off $P "tests/pbt_minikanren.nim" || exit 1
          echo "=== clause-matrix differential tests (issue #163, fixed seed) ==="
          nim c -r --hints:off $P "tests/pbt_clause_matrix.nim" || exit 1
          echo "=== clause-matrix negative tests (issue #163, fixed seed) ==="
          nim c -r --hints:off $P "tests/pbt_clause_matrix_neg.nim" || exit 1
          echo "=== QTT usage-checker property tests (issue #163, fixed seed) ==="
          nim c -r --hints:off $P "tests/pbt_usage.nim" || exit 1
          echo "=== staged-residual vs relational differential tests (issue #163, fixed seed) ==="
          nim c -r --hints:off $P "tests/pbt_staged_agreement.nim" || exit 1
          echo "=== unifier property tests (issue #163, fixed seed) ==="
          nim c -r --hints:off $P "tests/pbt_unify.nim" || exit 1
          # Note: lsp is built but not run — it's a server that blocks on stdin,
          # not a test suite. (Was hanging CI since Experiment 7.)
          echo "=== lsp hole-session tests (issue #58, headless mock-LSP) ==="
          nim c -r --hints:off $P "tests/test_lsp_holes.nim" || exit 1
          nim c -r --hints:off $P "tests/test_lsp_actions.nim" || exit 1
          echo "=== sheds tests (issues #133-135, #137) ==="
          nim c -r --hints:off $P "tests/test_sheds.nim" || exit 1
          nim c -r --hints:off $P "tests/test_shed_layout.nim" || exit 1
          nim c -r --hints:off $P "tests/test_shed_loop.nim" || exit 1
          nim c -r --hints:off $P "tests/test_shed_refine_method.nim" || exit 1
          echo "=== vscode extension smoke (issue #136 client path, real lsp binary) ==="
          # The smoke test self-provisions the shed sidecar: it exercises the
          # extension's own generateSidecar path (issue #153) on the demo before
          # reading layouts from it. The sidecar is gitignored (*.sheds.json),
          # so this also covers the fresh-checkout case (was issue #142's fix).
          cd editors/vscode
          npm install --no-audit --no-fund || exit 1
          npm run build || exit 1
          LSP=../../src/eponym/lsp DEMO=../../examples/embedded/sheds_demo.nim node out/smoke.js || exit 1
          # Note: bench/ contains expensive benchmarks, not run in CI.
