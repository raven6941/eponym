name: ci
on: [push, pull_request]
jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nim
        run: |
          curl -sSf https://nim-lang.org/choosenim/init.sh | sh -s -- -y
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
      - name: Select Nim version
        run: choosenim 2.2.12
      - name: Build LSP server
        run: nim c src/eponym/lsp.nim
      - name: Restore VS Code test archive
        uses: actions/cache@v4
        with:
          path: editors/vscode/.vscode-test
          key: vscode-test-linux-1.85.0
      - name: Install extension dependencies
        working-directory: editors/vscode
        run: npm ci
      - name: Build extension
        working-directory: editors/vscode
        run: npm run build
      - name: Run VS Code integration tests
        working-directory: editors/vscode
        env:
          EPONYM_TEST_LSP: ${{ github.workspace }}/src/eponym/lsp
        run: xvfb-run -a npm run test:integration
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Shards are driven by tools/ci-local.sh (EPONYM_CI_SHARD), the
        # single source of truth for the matrix. Each shard runs serially
        # on its own runner: concurrent nim processes must not share one
        # nimcache (link failures; diagnosed on issue #404), so local
        # parallelism is out and sharding across runners is the parallel
        # driver. Add or remove shards here to rebalance.
        shard: ["0/3", "1/3", "2/3"]
    env:
      EPONYM_CI_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Nim
        run: |
          curl -sSf https://nim-lang.org/choosenim/init.sh | sh -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
      - name: Select Nim version
        run: choosenim 2.2.12
      # Persist the shared nimcache: every GitHub run used to start with an
      # empty one and recompile the whole elaborator closure per driver.
      # Keyed per shard (each runner writes its own cache) with restore-key
      # fallback to any shard's cache; Nim's own source-hash invalidation
      # keeps restored objects correct.
      - name: Restore nimcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/eponym-ci-nimcache
          key: nimcache-ubuntu-nim2.2.12-shard${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            nimcache-ubuntu-nim2.2.12-shard${{ matrix.shard }}-
            nimcache-ubuntu-nim2.2.12-
      # Persist the nimble package dir so the falsify install in
      # tools/ci-local.sh is a no-op on warm runners. Key rotates when the
      # script changes (e.g. the falsify install line); upstream falsify
      # moves do not invalidate it — bump by editing the key suffix if a
      # fresh falsify is ever needed.
      - name: Restore nimble packages
        uses: actions/cache@v4
        with:
          path: ~/.nimble/pkgs2
          key: nimble-pkgs2-ubuntu-${{ hashFiles('tools/ci-local.sh') }}
          restore-keys: |
            nimble-pkgs2-ubuntu-
      - name: Build and test (shard ${{ matrix.shard }})
        # The matrix lives in tools/ci-local.sh — the single source of truth.
        # Run it locally before merging: sh tools/ci-local.sh
        run: sh tools/ci-local.sh
