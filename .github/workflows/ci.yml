name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nim
        run: |
          curl -sSf https://nim-lang.org/choosenim/init.sh | sh -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
      - name: Select Nim version
        run: choosenim 2.2.12
      - name: Build and test
        # The matrix lives in tools/ci-local.sh — the single source of truth.
        # Run it locally before merging: sh tools/ci-local.sh
        run: sh tools/ci-local.sh
