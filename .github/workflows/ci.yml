name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nim
        run: |
          curl -sSf https://nim-lang.org/choosenim/init.sh | sh -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
      - name: Select Nim version
        run: choosenim 2.2.12
      - name: Build
        run: |
          nim --version
          for f in ett ett_init preterm parse_surf mac_surf elab ett_mac lsp egraph ett_embed; do
            echo "=== build $f ==="
            nim c --hints:off --path:src "src/$f.nim" || exit 1
          done
      - name: Test
        run: |
          for f in ett ett_init preterm parse_surf mac_surf elab ett_mac egraph ett_embed; do
            echo "=== test $f ==="
            nim c -r --hints:off --path:src "src/$f.nim" || exit 1
          done
          echo "=== examples ==="
          nim c -r --hints:off --path:src "tests/run_examples.nim" || exit 1
          # Note: lsp is built but not run — it's a server that blocks on stdin,
          # not a test suite. (Was hanging CI since Experiment 7.)
