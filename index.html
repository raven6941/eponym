<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <title>Eponym — dependent types for Nim</title>
    <link rel="canonical" href="https://raven6941.github.io/eponym/">
    <style>
      :root {
        color-scheme: light;
        --paper: #f4f0e6; --sheet: #fbf9f3; --ink: #242b27;
        --muted: #69736b; --green: #315b45; --rule: #d9d4c8; --red: #a35e4c;
        font-family: Georgia, "Times New Roman", serif;
        background: var(--paper); color: var(--ink);
        font-synthesis: none; text-rendering: optimizeLegibility;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0; background-color: var(--paper);
        background-image: radial-gradient(#817b6b 0.45px, transparent 0.45px);
        background-size: 8px 8px; font-size: 17px; line-height: 1.72;
      }
      a { color: var(--green); text-decoration-thickness: 1px; text-underline-offset: 3px; }
      a:hover { color: #192f23; }
      a:focus-visible { outline: 2px solid var(--red); outline-offset: 4px; }
      .topbar { display: flex; justify-content: space-between; align-items: center; max-width: 1120px; margin: auto; padding: 1rem 2rem; color: var(--muted); font: 600 .73rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; }
      .topbar a { color: inherit; text-decoration: none; }
      .topbar a:hover { color: var(--green); }
      .layout { display: grid; grid-template-columns: 190px minmax(0, 760px); gap: 3rem; align-items: start; max-width: 1120px; margin: 0 auto; padding: 1rem 2rem 6rem; }
      aside { position: sticky; top: 2rem; padding-top: 1.4rem; font: .85rem/1.55 ui-sans-serif, system-ui, sans-serif; }
      .index-label { margin: 0 0 .8rem; color: var(--red); font: 700 .68rem/1.2 ui-monospace, monospace; letter-spacing: .13em; text-transform: uppercase; }
      nav { display: grid; gap: .28rem; border-left: 1px solid #bcb6a9; padding-left: 1rem; }
      nav a { color: #59645b; text-decoration: none; }
      nav a:hover { color: var(--green); text-decoration: underline; }
      nav a.subheading { padding-left: .75rem; color: #7d8278; font-size: .92em; }
      .sheet { position: relative; min-width: 0; padding: clamp(2rem, 6vw, 4.75rem); background: var(--sheet); border: 1px solid #ded9cd; box-shadow: 2px 3px 0 #ded9cd, 7px 9px 0 #e8e2d6, 0 18px 55px #35332212; }
      .sheet::before { position: absolute; top: 0; bottom: 0; left: 2.15rem; width: 1px; background: #c7837138; content: ""; pointer-events: none; }
      .folio { display: flex; justify-content: space-between; gap: 1rem; padding-bottom: .8rem; border-bottom: 1px solid var(--rule); color: var(--muted); font: .68rem/1.4 ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; }
      #readme h1 { margin: 0; padding: 3.2rem 0 1.5rem; border-bottom: 1px solid var(--rule); font-size: clamp(3rem, 9vw, 5.5rem); line-height: .98; letter-spacing: -.06em; }
      #readme h1 a { color: inherit; text-decoration: none; }
      #readme h2 { display: flex; align-items: baseline; gap: .8rem; margin: 2.6rem 0 1.15rem; padding-top: .4rem; color: var(--green); font-size: 1.9rem; font-weight: 500; line-height: 1.2; scroll-margin-top: 1rem; }
      #readme h3 { margin: 1.8rem 0 .55rem; font-size: 1.27rem; font-weight: 500; scroll-margin-top: 1rem; }
      #readme p { margin: .8rem 0; }
      #readme ul, #readme ol { padding-left: 1.3rem; }
      #readme li { margin: .45rem 0; padding-left: .2rem; }
      #readme li::marker { color: #788878; }
      #readme strong { color: #293b2e; }
      #readme code, #readme pre { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      #readme code { color: #744d3d; font-size: .84em; }
      #readme pre { overflow-x: auto; margin: 1.2rem 0; padding: 1.15rem 1.3rem; border: 1px solid #e1ddd2; background: #f2efe7; color: #28352d; font-size: .79rem; line-height: 1.65; }
      #readme pre code { color: inherit; font-size: inherit; }
      #readme img { display: block; max-width: 100%; height: auto; margin: 1.5rem auto .3rem; border: 1px solid var(--rule); }
      #readme blockquote { margin: 1.2rem 0; padding: .2rem 0 .2rem 1rem; border-left: 2px solid #b47b68; color: #5d6258; }
      .endnote { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--rule); color: var(--muted); font: .72rem/1.6 ui-monospace, monospace; }
      @media (max-width: 820px) {
        .layout { display: block; padding: .5rem 1rem 3rem; }
        aside { position: static; padding: .4rem 0 1.2rem; }
        nav { display: flex; flex-wrap: wrap; gap: .35rem 1rem; border-left: 0; padding: 0; }
        .index-label { margin-bottom: .5rem; }
        .sheet { padding: clamp(1.5rem, 6vw, 3rem); }
        .sheet::before { left: .8rem; }
      }
      @media (max-width: 480px) {
        body { font-size: 16px; }
        .topbar { padding: .9rem 1rem; }
        .topbar span:last-child { display: none; }
        .folio { font-size: .6rem; }
        #readme h1 { padding-top: 2.4rem; }
      }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    </style>
  </head>
  <body>
    <header class="topbar"><a href="#top">Eponym / research notebook</a><span>Dependent types · Nim · QTT</span><a href="https://github.com/raven6941/eponym">GitHub ↗</a></header>
    <div class="layout" id="top">
      <aside aria-label="Table of contents">
        <p class="index-label">On this page</p>
        <nav id="toc" aria-label="README sections"><a href="#readme">Loading contents…</a></nav>
      </aside>
      <main class="sheet">
        <div class="folio"><span>Field notes / language tools</span><span>Project 01 · Nim</span></div>
        <article id="readme" aria-label="Project README"></article>
        <footer class="endnote">Rendered from <a href="https://github.com/raven6941/eponym/blob/main/README.md">README.md</a> · <a href="https://github.com/raven6941/eponym">Source repository</a></footer>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      (async function () {
        const article = document.getElementById('readme');
        const toc = document.getElementById('toc');
        try {
          const response = await fetch('README.md');
          if (!response.ok) throw new Error('Could not load README.md');
          const markdown = await response.text();
          const renderer = new marked.Renderer();
          const slugCounts = new Map();
          const slug = (text) => {
            const base = text.toLowerCase().replace(/<[^>]*>/g, '').trim()
              .replace(/[^\w\- ]/g, '').replace(/\s+/g, '-');
            const count = slugCounts.get(base) || 0;
            slugCounts.set(base, count + 1);
            return count ? `${base}-${count}` : base;
          };
          renderer.heading = function ({ tokens, depth }) {
            const text = this.parser.parseInline(tokens);
            const id = slug(text);
            return `<h${depth} id="${id}">${text}</h${depth}>`;
          };
          marked.setOptions({ renderer, gfm: true, breaks: false });
          article.innerHTML = marked.parse(markdown);
          article.querySelectorAll('h1, h2, h3').forEach((heading) => {
            if (!heading.id) heading.id = slug(heading.textContent);
          });
          const headings = [...article.querySelectorAll('h2, h3')];
          toc.replaceChildren(...headings.map((heading) => {
            const link = document.createElement('a');
            link.href = `#${heading.id}`;
            link.textContent = heading.textContent;
            if (heading.tagName === 'H3') link.className = 'subheading';
            return link;
          }));
        } catch (error) {
          article.innerHTML = '<h1>Eponym</h1><p>The README could not be loaded. You can read it on <a href="https://github.com/raven6941/eponym/blob/main/README.md">GitHub</a>.</p>';
          toc.innerHTML = '';
        }
      })();
    </script>
  </body>
</html>
